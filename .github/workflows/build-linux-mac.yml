name: build-linux-mac

# Baut die Desktop-App fuer Linux (AppImage + deb) und versucht einen
# macOS-Zip-Build auf demselben Runner.
#
# Linux laeuft zuverlaessig. macOS ist ein Cross-Build von Linux aus und wird
# von electron-builder offiziell nicht unterstuetzt (dmg braucht hdiutil) --
# deshalb continue-on-error: der Zip-Weg wird versucht, ein Fehlschlag darf
# aber die Linux-Artefakte nicht mitreissen.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (AppImage + deb)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux packages
        working-directory: apps/desktop
        run: npm run build && npm run builder -- --linux AppImage deb
        env:
          NODE_OPTIONS: --max-old-space-size=16384

      - name: Show result
        run: ls -la apps/desktop/release/ | grep -iE "appimage|deb" || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error
          retention-days: 7

  mac:
    name: macOS zip (Cross-Build, Best Effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS zip
        working-directory: apps/desktop
        run: npm run build && npm run builder -- --mac zip
        env:
          NODE_OPTIONS: --max-old-space-size=16384
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Show result
        run: ls -la apps/desktop/release/ | grep -i zip || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac
          path: apps/desktop/release/*.zip
          if-no-files-found: warn
          retention-days: 7
