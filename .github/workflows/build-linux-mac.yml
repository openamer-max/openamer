name: build-linux-mac

# Baut die Desktop-App fuer Linux (AppImage + deb) und macOS (zip, x64 + arm64).
#
# Linux: deb/AppImage verlangen ein "homepage"-Feld in der package.json --
#   Windows (NSIS) braucht es nicht, deshalb fehlte es und der Build brach ab
#   mit "Please specify project homepage". Wird hier vor dem Build gesetzt.
#
# macOS: es gibt keinen macOS-Runner fuer dieses Konto. Der Cross-Build auf
#   Linux funktioniert nur, wenn electron-builder die DARWIN-Electron-Binaries
#   bekommt. Das Repo-Skript run-electron-builder.mjs setzt electronDist aber
#   auf die lokale (Linux-)Distribution -> "corrupted Electron dist". Deshalb
#   wird hier das passende darwin-Archiv geladen und electron-builder direkt
#   mit -c.electronDist aufgerufen.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (AppImage + deb)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Set homepage (deb/AppImage require it)
        run: |
          node -e "
            const fs=require('fs'), f='apps/desktop/package.json';
            const p=JSON.parse(fs.readFileSync(f,'utf8'));
            p.homepage='https://openamer-max.github.io/';
            p.author=p.author||'Amer Sacirovic <https://openamer-max.github.io/>';
            fs.writeFileSync(f, JSON.stringify(p,null,2));
            console.log('homepage =', p.homepage);
          "

      - name: Build Linux packages
        working-directory: apps/desktop
        run: npm run build && npm run builder -- --linux AppImage deb
        env:
          NODE_OPTIONS: --max-old-space-size=16384

      - name: Show result
        run: ls -la apps/desktop/release/ | grep -iE "appimage|deb" || true

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error
          retention-days: 7

  mac:
    name: macOS zip (x64 + arm64)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Set homepage
        run: |
          node -e "
            const fs=require('fs'), f='apps/desktop/package.json';
            const p=JSON.parse(fs.readFileSync(f,'utf8'));
            p.homepage='https://openamer-max.github.io/';
            fs.writeFileSync(f, JSON.stringify(p,null,2));
          "

      - name: Download macOS Electron binaries
        run: |
          VER=$(node -p "require('electron/package.json').version")
          echo "Electron $VER"
          for arch in x64 arm64; do
            curl -sSL -o "mac-$arch.zip" \
              "https://github.com/electron/electron/releases/download/v$VER/electron-v$VER-darwin-$arch.zip"
            mkdir -p "mac-dist-$arch"
            unzip -q "mac-$arch.zip" -d "mac-dist-$arch"
            echo "  $arch: $(du -sh mac-dist-$arch | cut -f1)"
          done

      - name: Build macOS zips
        working-directory: apps/desktop
        run: |
          npm run build
          for arch in x64 arm64; do
            echo "=== $arch ==="
            npx electron-builder --mac zip --$arch \
              -c.electronDist="$GITHUB_WORKSPACE/mac-dist-$arch" \
              -c.directories.output="release-mac-$arch" \
              -c.mac.identity=null
          done
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          NODE_OPTIONS: --max-old-space-size=16384

      - name: Show result
        run: ls -la apps/desktop/release-mac-*/ 2>/dev/null | head -30 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac
          path: apps/desktop/release-mac-*/*.zip
          if-no-files-found: warn
          retention-days: 7
